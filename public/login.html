<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסה — Mission Control</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="loginwrap">
  <form class="loginbox" id="loginForm">
    <h1>Mission Control</h1>
    <p class="sub">חתול פיננסי</p>

    <div class="frow">
      <label for="email">אימייל</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="frow">
      <label for="password">סיסמה</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="btn primary" type="submit" id="submitBtn">כניסה</button>
    <div class="loginerr" id="err"></div>
    <div class="loginsep" id="googleWrap" hidden><span>או</span></div>
    <a class="btn google" id="googleBtn" href="/api/auth/google" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
      התחבר עם Google
    </a>
  </form>
</div>

<script src="/login.js"></script>
</body>
</html>
