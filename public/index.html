<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — חתול פיננסי</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div class="hrow">
    <h1>Mission Control <small>חתול פיננסי</small></h1>
    <div class="spacer"></div>
    <button class="btn primary" id="btnUrgent">⚡ מבצע דחוף</button>
    <button class="btn small bell" id="btnAlerts" title="התראות">🔔<span class="badge" id="alertBadge" hidden></span></button>
    <span class="userbadge" id="userBadge"></span>
    <button class="btn small" id="btnLogout">יציאה</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-t="board">הלוח</button>
    <button class="tab" role="tab" aria-selected="false" data-t="strategy">אסטרטגיה</button>
    <button class="tab" role="tab" aria-selected="false" data-t="plan">קמפיינים ותוכן</button>
    <button class="tab" role="tab" aria-selected="false" data-t="tasks">משימות<span class="badge" id="taskBadge" hidden></span></button>
    <button class="tab" role="tab" aria-selected="false" data-t="data">נתונים</button>
    <button class="tab" role="tab" aria-selected="false" data-t="manage">ניהול</button>
  </nav>
</header>

<main>
  <section id="board"></section>
  <section id="strategy" hidden></section>
  <section id="plan" hidden></section>
  <section id="tasks" hidden></section>
  <section id="data" hidden></section>
  <section id="manage" hidden></section>
</main>

<!-- מבצע דחוף -->
<dialog id="urgentDlg">
  <h3>מבצע דחוף</h3>
  <div class="frow">
    <label for="uTitle">מה מפרסמים?</label>
    <input id="uTitle" type="text" placeholder="מבצע 48 שעות — קורס תקציב משפחתי">
  </div>
  <div class="frow">
    <label for="uEndpoint">נקודת קצה</label>
    <select id="uEndpoint"></select>
  </div>
  <div class="frow">
    <label for="uUntil">רלוונטי עד</label>
    <input id="uUntil" type="date">
  </div>
  <div class="frow">
    <label>איפה</label>
    <div class="checks" id="uChannels"></div>
  </div>
  <div class="whatif" id="uWhatIf">
    <b>מה יקרה:</b>
    מלאו את הפרטים ולחצו "בדוק" כדי לראות איפה זה ישובץ.
  </div>
  <label class="ack-row">
    <input type="checkbox" id="uAck">
    <span>ידוע לי שזו רק כותרת קצרה בלי טקסט מלא, שזה תופס משבצת פנויה בלוח,
      ושאם לא יתווסף תוכן עד מועד הפרסום — השיבוץ יימחק אוטומטית.</span>
  </label>
  <div class="dactions">
    <button class="btn" id="uCancel">ביטול</button>
    <button class="btn" id="uCheck">בדוק</button>
    <button class="btn primary" id="uOk" disabled>אשר</button>
  </div>
</dialog>

<!-- מנוע השיבוץ -->
<dialog id="engineDlg">
  <h3>מילוי השבוע — הצעת המנוע</h3>
  <div id="enginePlan"></div>
  <div class="dactions">
    <button class="btn" id="eCancel">ביטול</button>
    <button class="btn primary" id="eApply" disabled>שבץ הכול</button>
  </div>
</dialog>

<!-- תצוגה מקדימה של פוסט מהלוח -->
<dialog id="postDlg">
  <h3 id="postDlgTitle"></h3>
  <div id="postPreview"></div>
  <div class="dactions">
    <button class="btn" id="pOpenContent" style="margin-inline-end:auto">פתח בתוכן</button>
    <button class="btn" id="pPublish" style="color:var(--st-good)" hidden></button>
    <button class="btn" id="pDelete" style="color:var(--st-crit)">הסר מהלוח</button>
    <button class="btn primary" id="pClose">סגור</button>
  </div>
</dialog>

<!-- הוספת פוסט ידנית ממשבצת ריקה בלוח -->
<dialog id="addPostDlg">
  <h3>פוסט חדש</h3>
  <p class="sub" id="apContext"></p>
  <div class="frow">
    <label for="apTitle">כותרת</label>
    <input id="apTitle" type="text" placeholder="למשל: תזכורת להרשמה לוובינר">
  </div>
  <div class="frow">
    <label for="apEndpoint">נקודת קצה</label>
    <select id="apEndpoint"></select>
  </div>
  <div class="frow">
    <label for="apKind">סוג</label>
    <select id="apKind">
      <option value="value">ערך</option>
      <option value="hybrid">משולב</option>
      <option value="promo">מכירתי</option>
    </select>
  </div>
  <div class="frow">
    <label for="apTime">שעה</label>
    <input id="apTime" type="time" value="10:00">
  </div>
  <div class="dactions">
    <button class="btn" id="apCancel" style="margin-inline-end:auto">ביטול</button>
    <button class="btn" id="apAddOnly">הוסף פוסט</button>
    <button class="btn primary" id="apAddAndCheck">הוסף ובדוק שיבוץ מחדש</button>
  </div>
</dialog>

<!-- העוזר — ווידג'ט קבוע בפינת המסך -->
<div id="aiWidget">
  <div class="aipanel" id="aiPanel" hidden>
    <div class="aihead">
      <b>העוזר</b>
      <small id="aiCost">מבצע רק אחרי אישור</small>
      <span class="spacer"></span>
      <button class="aiico" id="aiClear" title="שיחה חדשה" aria-label="שיחה חדשה">⟳</button>
      <button class="aiico" id="aiClose" title="סגור" aria-label="סגור">✕</button>
    </div>
    <div id="aiLog"></div>
    <div class="aicompose">
      <textarea id="aiInput" rows="1" placeholder="שאל משהו, או בקש פעולה…"></textarea>
      <button class="btn primary small" id="aiSend">שלח</button>
    </div>
  </div>
  <button id="aiFab" title="העוזר" aria-label="פתח את העוזר">✨</button>
</div>

<!-- ייבוא תוכן מטבלה -->
<dialog id="importDlg">
  <h3>ייבוא תוכן מטבלה <small id="impCampaign"></small></h3>
  <div class="imphelp" id="impHelp"></div>
  <div class="frow">
    <label for="impText">הטבלה שתיובא — אפשר לערוך אותה כאן לפני שמייבאים</label>
    <textarea id="impText" placeholder="מדביקים טבלה מ־Excel, או מעלים מסמך והמערכת תפרק אותו."></textarea>
  </div>
  <div class="dactions" style="justify-content:space-between;flex-wrap:wrap">
    <span style="display:flex;gap:10px">
      <button class="btn" id="impPick">📄 העלה מסמך ונתח</button>
      <input type="file" id="impFile" accept=".xlsx,.xlsm,.docx,.pdf,.csv,.tsv,.txt" hidden>
    </span>
    <span style="display:flex;gap:10px">
      <button class="btn" id="impCancel">ביטול</button>
      <button class="btn" id="impCheck">בדוק</button>
      <button class="btn primary" id="impRun" disabled>ייבא</button>
    </span>
  </div>
  <div id="impResult"></div>
</dialog>

<!-- דיאלוג כללי (הוספת ערוץ / נקודה / קמפיין / תוכן / משתמש) -->
<dialog id="genDlg">
  <h3 id="genTitle"></h3>
  <div id="genBody"></div>
  <div class="dactions">
    <span id="genExtra" style="display:contents"></span>
    <button class="btn" id="genCancel">ביטול</button>
    <button class="btn primary" id="genSave">שמור</button>
  </div>
</dialog>

<!-- אישור/ביטול כללי — במקום confirm() של הדפדפן -->
<dialog id="confirmDlg" class="confirm-dlg">
  <p id="confirmMsg"></p>
  <div class="dactions">
    <button class="btn" id="confirmCancel">ביטול</button>
    <button class="btn primary" id="confirmOk">אישור</button>
  </div>
</dialog>

<div id="tt"></div>
<div id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
